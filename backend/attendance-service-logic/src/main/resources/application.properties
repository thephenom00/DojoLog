spring.application.name=dojolog

# Required secrets and connection details are supplied by the deployment environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.cache.type=simple

# Use a unique, randomly generated key (at least 32 bytes for HS256).
jwt.secret=${JWT_SECRET}

server.forward-headers-strategy=native
server.address=0.0.0.0
server.port=${PORT:8080}

# Mail delivery is configured per environment. Local development can leave these blank.
admin.email=${ADMIN_EMAIL:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db
spring.flyway.create-schemas=true
spring.flyway.mixed=true
spring.jackson.serialization.write-dates-as-timestamps=false